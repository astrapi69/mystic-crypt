# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: '.sdkmanrc'
          distribution: 'temurin'
      - name: Setup Gradle
        # v5.0.2, not v6: from v6 the action bundles a proprietary caching component (the maintainer's decision F2, 2026-11-20).
        # v5.0.2 lies in the range of GHSA-chpw-2mqm-95cc (fixed in 6.4.1), which affects only the two-workflow
        # download-and-submit setup; this workflow generates and submits in one job. Do not switch to download-and-submit.
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      # the project page is checked by page-check.yml on every build of the page, not here: the
      # page follows the release and names the previous one while a pull request is open
      - name: Execute Gradle build
        run: ./gradlew build
      - name: Upload the test reports
        # always, not only on failure: a green run whose results are thrown away with the job
        # cannot be checked afterwards, and how many tests ran then has no answer but a local run
        # (the maintainer, 2026-11-20, after astrapi69/mystic-crypt-ui#1070)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            build/test-results
            build/reports/tests
          retention-days: 14
      - name: Mutation testing (PIT, fails below mutationThreshold in build.gradle)
        run: |
          ./gradlew pitest
          # PIT's forked test runs leave src/test/resources/crypt/test.txt
          # deleted (see gradle/mutation-testing.gradle); put it back for the
          # steps after this one.
          git checkout -- src/test/resources/crypt/test.txt
      # a failed GnuPG test writes what the home looked like to build/test-diagnostics, which
      # the runner would discard with the job: PIT's log names a failed test, not why (#309)
      - name: Keep the diagnoses of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics
          path: build/test-diagnostics
          if-no-files-found: ignore
          retention-days: 30
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          # a broken upload must not read as green coverage tracking
          fail_ci_if_error: true
          # the uploader searches the tree and found .idea/runConfigurations/code_coverage_main.xml,
          # an IntelliJ run configuration, as a second "coverage file" (#151). Name the report
          # and switch the search off: a gate reporting numbers nobody produced is worse than one
          # reporting none
          files: build/reports/jacoco/test/jacocoTestReport.xml
          disable_search: true
      # Snapshots only. A non-SNAPSHOT version on develop is deliberately NOT
      # published here: the release commit reaches develop before the RELEASE-*
      # tag, and publishing it from this push would duplicate the tag-triggered
      # upload in publish.yml (#84).
      - name: Publish snapshot to Maven Central
        if: github.event_name == 'push'
        run: |
          if grep -q -- '-SNAPSHOT' gradle.properties; then
            ./gradlew nmcpPublishAllPublicationsToCentralPortalSnapshots
          else
            echo "non-SNAPSHOT version: release publishing happens only via publish.yml (RELEASE-* tag)"
          fi
        env:
          CENTRAL_PORTAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}
          CENTRAL_PORTAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # the signing subkey's last 8 hex digits, as publish.yml passes it (#190): since the
          # secrets hold the subkey alone (2026-10-10), signing without it takes the primary
          # key's stub and fails every push build at this step
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
