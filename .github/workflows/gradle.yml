# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Checkout the project page (gh-pages), checked by ReleaseConsistencyTest
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Execute Gradle build
        env:
          PAGES_INDEX: ${{ github.workspace }}/gh-pages/index.html
        run: ./gradlew build
      - name: Mutation testing (PIT, fails below mutationThreshold in build.gradle)
        env:
          PAGES_INDEX: ${{ github.workspace }}/gh-pages/index.html
        run: |
          ./gradlew pitest
          # PIT's forked test runs leave src/test/resources/crypt/test.txt
          # deleted (see gradle/mutation-testing.gradle); put it back for the
          # steps after this one.
          git checkout -- src/test/resources/crypt/test.txt
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          # a broken upload must not read as green coverage tracking
          fail_ci_if_error: true
          # the uploader searches the tree and found .idea/runConfigurations/code_coverage_main.xml,
          # an IntelliJ run configuration, as a second "coverage file" (#151). Name the report
          # and switch the search off: a gate reporting numbers nobody produced is worse than one
          # reporting none
          files: build/reports/jacoco/test/jacocoTestReport.xml
          disable_search: true
      # Snapshots only. A non-SNAPSHOT version on develop is deliberately NOT
      # published here: the release commit reaches develop before the RELEASE-*
      # tag, and publishing it from this push would duplicate the tag-triggered
      # upload in publish.yml (#84).
      - name: Publish snapshot to Maven Central
        if: github.event_name == 'push'
        run: |
          if grep -q -- '-SNAPSHOT' gradle.properties; then
            ./gradlew nmcpPublishAllPublicationsToCentralPortalSnapshots
          else
            echo "non-SNAPSHOT version: release publishing happens only via publish.yml (RELEASE-* tag)"
          fi
        env:
          CENTRAL_PORTAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}
          CENTRAL_PORTAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # the signing subkey's last 8 hex digits, as publish.yml passes it (#190): since the
          # secrets hold the subkey alone (2026-10-10), signing without it takes the primary
          # key's stub and fails every push build at this step
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
