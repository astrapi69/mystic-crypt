# Sets the status "maintainer-read" on a pull request (#732): failure while it changes a path that
# .github/CODEOWNERS lists - the vault format, and this check's own files - and the maintainer has
# not set the label read-by-maintainer himself; success otherwise. Branch protection requires the
# status, so a wrong line where it loses or exposes data is merged only after he has read it.
# "Require review from Code Owners" cannot say that: every pull request comes from the owner's own
# account, and GitHub does not let an author approve his own pull request.
#
# A new push removes the label, so what was read is what is merged; so does a reopening, which can
# bring pushes made while the pull request was closed. A label set through a GitHub App or from
# another account does not count (scripts/maintainer-read.py). An agent acting as the owner's
# account looks to GitHub like the owner himself; keeping it from setting the label is a local
# hook's job, not this workflow's.
#
# pull_request_target, like release-freeze: the job checks out the base branch's script and
# CODEOWNERS only, runs nothing a pull request brings, and puts no title or body into a shell line,
# so a pull request cannot change the check that judges it.
#
# No concurrency group: a group cancels a waiting run when the next one queues, and a cancelled run
# of a push would leave the label on lines nobody read. So runs may overlap, and each one says
# pending first, so that a run that dies leaves no earlier success standing, and decides a success
# a second time, so that a label removed while it was deciding does not leave the success behind.
name: Maintainer read

on:
  pull_request_target:
    branches: [ develop, master, 'hotfix/**' ]
    types: [ opened, reopened, synchronize, labeled, unlabeled ]

permissions:
  contents: read
  pull-requests: write
  issues: read
  statuses: write

jobs:
  # not named maintainer-read: a job's own check run of that name would satisfy the required status
  set-status:

    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ACTION: ${{ github.event.action }}
      MAINTAINER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout the base branch's script and CODEOWNERS
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false
      - name: Set the maintainer-read status of the pull request's head
        run: |
          set -euo pipefail
          status() {
            gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state="$1" -f context=maintainer-read \
              -f description="$2" -f target_url="$RUN_URL" > /dev/null
            echo "#$PR $1: $2"
          }
          labels() {
            gh api --paginate "repos/$REPO/issues/$PR/labels?per_page=100" --jq '.[] | {name}' \
              | jq -s 'map(.name)'
          }
          decide() {
            labels > labels.json
            gh api --paginate "repos/$REPO/issues/$PR/events?per_page=100" --jq '.[]' \
              | jq -s . > events.json
            jq -n --rawfile codeowners .github/CODEOWNERS --slurpfile files files.json \
              --slurpfile labels labels.json --slurpfile events events.json \
              --arg maintainer "$MAINTAINER" \
              '{codeowners: $codeowners, files: $files[0], labels: $labels[0], events: $events[0],
                maintainer: $maintainer}' > input.json
            python3 -I scripts/maintainer-read.py < input.json > status.tsv
            IFS=$'\t' read -r state description < status.tsv
          }

          status pending "deciding whether a path CODEOWNERS lists has changed"
          if [ "$ACTION" = synchronize ] || [ "$ACTION" = reopened ]; then
            if labels | jq -e 'any(. == "read-by-maintainer")' > /dev/null; then
              gh api -X DELETE "repos/$REPO/issues/$PR/labels/read-by-maintainer" > /dev/null
              echo "removed read-by-maintainer: the $ACTION brings lines the maintainer has not read"
            fi
          fi

          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
            --jq '.[] | {filename, previous_filename}' | jq -s . > changes.json
          if [ "$(jq length changes.json)" -ge 3000 ]; then
            echo "3000 changed files or more, the most the API lists: the rest are unknown, no decision"
            exit 1
          fi
          jq 'map(.filename, (.previous_filename // empty))' changes.json > files.json

          decide
          status "$state" "$description"
          if [ "$state" = success ]; then
            decide
            status "$state" "$description"
          fi
      - name: Set the status to error when it could not be decided
        if: failure()
        run: |
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state=error -f context=maintainer-read \
            -f description="the check could not decide; the log of its run says why" \
            -f target_url="$RUN_URL" > /dev/null
