# Submits the dependency graph Gradle resolves to GitHub, so the repository's dependency graph and
# Dependabot see this build's dependencies; GitHub reads no Gradle build by itself. 'runtime' marks
# runtimeClasspath, everything else - tests, build tools - is 'development'. The same pattern as
# astrapi69/mystic-crypt-ui#634.

name: Dependency submission

on:
  push:
    branches: [ develop, master ]
  # by hand, to submit another branch
  workflow_dispatch:

permissions:
  contents: write # the dependency submission API

jobs:
  submit:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: '.sdkmanrc'
          distribution: 'temurin'
      - name: Submit the dependency graph
        # v5.0.2, not v6: from v6 the action bundles a proprietary caching component (the maintainer's decision F2, 2026-11-20).
        # v5.0.2 lies in the range of GHSA-chpw-2mqm-95cc (fixed in 6.4.1), which affects only the two-workflow
        # download-and-submit setup; this workflow generates and submits in one job. Do not switch to download-and-submit.
        uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        env:
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: '^runtimeClasspath$'
        with:
          # The graph plugin registers its resolving task once the projects are evaluated, which
          # configure-on-demand does not wait for
          additional-arguments: -Dorg.gradle.configureondemand=false
