# Checks the project page on gh-pages against the sources: the release version, the Maven
# coordinates, the command table, the Search Console file and the sitemap (ReleaseConsistencyTest).
#
# The page follows the release: it is updated as post-release work, after the artifacts are
# verified on Maven Central. So this check runs on every build of the page, not in the pull request
# run, where the page still names the previous release - failing that run forced the page update
# BEFORE anything was published, which is backwards (seen at 13.10).
#
# page_build, not push to gh-pages: a push runs the workflows of the pushed commit, and gh-pages
# carries none, so "push: branches: [gh-pages]" never fired (the 13.11 page, 4ade850d, went out
# unchecked). page_build fires on every build of the Pages source and reads this file from the
# default branch, which is where it lives.
#
# PAGES_CHECK=required keeps this run fail-closed: without PAGES_INDEX it fails, never skips, so a
# wiring mistake here cannot read as a green page.
name: Project page

on:
  page_build:
  workflow_dispatch:

jobs:
  page-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources (develop)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - name: Checkout the project page (gh-pages)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: '.sdkmanrc'
          distribution: 'temurin'
      - name: Setup Gradle
        # v5.0.2, not v6: from v6 the action bundles a proprietary caching component (the maintainer's decision F2, 2026-11-20).
        # v5.0.2 lies in the range of GHSA-chpw-2mqm-95cc (fixed in 6.4.1), which affects only the two-workflow
        # download-and-submit setup; this workflow generates and submits in one job. Do not switch to download-and-submit.
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Check the page against the sources
        env:
          PAGES_INDEX: ${{ github.workspace }}/gh-pages/index.html
          PAGES_CHECK: required
        run: ./gradlew test --tests "io.github.astrapi69.mystic.crypt.ReleaseConsistencyTest"
