name: Test Cases Badge

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test

      - name: Extract test count
        id: test_count
        run: |
          # Gradle's JUnit XML reports: one <testsuite tests="N" .../> root per test class,
          # sum the tests attribute across all of them.
          TOTAL=$(grep -ohE 'tests="[0-9]+"' build/test-results/test/*.xml \
            | grep -oE '[0-9]+' | awk '{sum += $1} END {print sum}')

          # Fallback falls kein Report existiert
          if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            TOTAL="0"
            COLOR="red"
          elif [ "$TOTAL" -lt 50 ]; then
            COLOR="yellow"
          elif [ "$TOTAL" -lt 200 ]; then
            COLOR="green"
          else
            COLOR="brightgreen"
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "color=$COLOR" >> $GITHUB_OUTPUT
          echo "Test cases found: $TOTAL"

      - name: Update badge
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 69b2e93dd826ce43cc3f02433a465ae3
          filename: test-cases.json
          label: test cases
          message: ${{ steps.test_count.outputs.total }}
          color: ${{ steps.test_count.outputs.color }}