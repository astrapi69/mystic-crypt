name: Test Cases Badge

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version-file: '.sdkmanrc'

      - name: Setup Gradle
        # v5.0.2, not v6: from v6 the action bundles a proprietary caching component (the maintainer's decision F2, 2026-11-20).
        # v5.0.2 lies in the range of GHSA-chpw-2mqm-95cc (fixed in 6.4.1), which affects only the two-workflow
        # download-and-submit setup; this workflow generates and submits in one job. Do not switch to download-and-submit.
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # The project page is checked by page-check.yml on every build of the page, not here: it follows
      # the release and names the previous one until then (#303).
      - name: Run tests
        run: ./gradlew test

      - name: Extract test count
        id: test_count
        run: |
          # Gradle's JUnit XML reports: one <testsuite tests="N" .../> root per test class,
          # sum the tests attribute across all of them.
          TOTAL=$(grep -ohE 'tests="[0-9]+"' build/test-results/test/*.xml \
            | grep -oE '[0-9]+' | awk '{sum += $1} END {print sum}')

          # Fallback falls kein Report existiert
          if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            TOTAL="0"
            COLOR="red"
          elif [ "$TOTAL" -lt 50 ]; then
            COLOR="yellow"
          elif [ "$TOTAL" -lt 200 ]; then
            COLOR="green"
          else
            COLOR="brightgreen"
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "color=$COLOR" >> $GITHUB_OUTPUT
          echo "Test cases found: $TOTAL"

      - name: Update badge
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 69b2e93dd826ce43cc3f02433a465ae3
          filename: test-cases.json
          label: Tested Use Cases
          message: ${{ steps.test_count.outputs.total }}
          color: ${{ steps.test_count.outputs.color }}