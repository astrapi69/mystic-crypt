def releaseVersion = !version.endsWith("SNAPSHOT")

task sourcesJar(type: Jar) {
    archiveClassifier.set("sources")
    from(sourceSets.main.allJava)
}

task javadocJar(type: Jar) {
    from javadoc
    archiveClassifier.set("javadoc")
}

javadoc {
    // A javadoc error must break the build instead of being silently packaged into the
    // published -javadoc.jar. Note this used to be written as `javadoc.properties.failOnError`
    // inside the javadocJar task, which only put an entry named "failOnError" into the task's
    // extra-properties map and left the real Javadoc.failOnError flag at the false set below.
    failOnError = true
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption("html5", true)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "$rootProject.name"
            from components.java
            artifact sourcesJar
            artifact javadocJar
            pom {
                name = "$rootProject.name"
                description = "$projectDescription"
                url = "$projectScmProviderUrl" + "$projectHolderUsername" + "$slash" + "$rootProject.name"
                organization {
                    name = "$projectOrganizationName"
                    url = "$projectOrganizationUrl"
                }
                issueManagement {
                    system = "$projectIssueManagementSystem"
                    url = "$projectScmProviderUrl" + "$projectHolderUsername" + "$slash" + "$rootProject.name" + "$issuesPath"
                }
                licenses {
                    license {
                        name = "$projectLicenseName"
                        url = "$projectLicenseUrl"
                        distribution = "$projectLicenseDistribution"
                    }
                }
                developers {
                    developer {
                        id = "$projectHolderUsername"
                        name = "$projectLeaderName"
                    }
                }
                scm {
                    connection = "$projectScmGitUrlPrefix" + "$projectScmProviderDomain" + "$colon" + "$projectHolderUsername" + "$slash" + "$rootProject.name" + "$projectScmGitUrlSuffix"
                    developerConnection = "$projectScmGitUrlPrefix" + "$projectScmProviderDomain" + "$colon" + "$projectHolderUsername" + "$slash" + "$rootProject.name" + "$projectScmGitUrlSuffix"
                    url = "$projectScmGitUrlPrefix" + "$projectScmProviderDomain" + "$colon" + "$projectHolderUsername" + "$slash" + "$rootProject.name" + "$projectScmGitUrlSuffix"
                }
            }
        }
    }
}

// Central Portal publishing. This uses the per-project "com.gradleup.nmcp" plugin rather than the
// "com.gradleup.nmcp.settings" one: mystic-crypt is a single-project build, so there is nothing to
// aggregate, and the settings plugin's aggregation wiring passes a Project as a dependency notation
// (DefaultNmcpSettings.kt:37), which Gradle 10 removes.
nmcp {
    publishAllPublicationsToCentralPortal {
        // Generate a user token at https://central.sonatype.com/ (Account -> Generate User Token).
        // This is NOT the legacy OSSRH username/password - the Portal Publisher API requires a
        // dedicated token pair.
        username = System.getenv("CENTRAL_PORTAL_TOKEN_USERNAME") ?: ""
        password = System.getenv("CENTRAL_PORTAL_TOKEN_PASSWORD") ?: ""
        // USER_MANAGED, matching crypt-api and crypt-data: CI uploads the bundle and the Portal
        // validates it, but the version stays unpublished until it is released by hand at
        // https://central.sonatype.com. AUTOMATIC would release it the moment validation passes,
        // and a released Maven Central version can never be changed or withdrawn - only
        // superseded by a new one.
        publishingType = "USER_MANAGED"
    }
}

signing {
    if (releaseVersion) {
        def signingKey = System.getenv("GPG_PRIVATE_KEY")
        def signingPassphrase = System.getenv("GPG_PASSPHRASE")
        if (signingKey && signingPassphrase) {
            useInMemoryPgpKeys(signingKey, signingPassphrase)
        }
        sign publishing.publications.mavenJava
    }
}
