// The version is resolved at configuration time on purpose: reading project.version from inside
// doLast is "Invocation of Task.project at execution time", which Gradle 10 removes.
def releaseVersion = "$version"

tasks.register("tagRelease") {
    description = "Tags the current head with the project's version."
    doLast {
        grgit.tag.add {
            name = "RELEASE-${releaseVersion}"
            message = "New release in version ${releaseVersion}"
        }
    }
}
