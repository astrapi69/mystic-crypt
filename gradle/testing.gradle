test {
    useJUnitPlatform()
}

jacoco {
    toolVersion = '0.8.16'
}

jacocoTestReport {
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

// The documented quality bar (docs/TESTING.md) enforced, not just measured:
// the build fails when branch coverage drops below 100%. Line coverage is not
// gated because the two System.exit lines in MysticCryptCli#main are a
// documented, argued exception (docs/COVERAGE_EXCEPTIONS.md).
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
    }
}
jacocoTestCoverageVerification.dependsOn test

check.dependsOn jacocoTestReport
check.dependsOn jacocoTestCoverageVerification

// The mystic-crypt releases that mystic-crypt-ui shipped, resolved by a build of their own
// (gradle/published-releases), since this build would resolve its own coordinates to itself.
// PublishedEnvelopesStillOpenTest loads every one in a class loader of its own and lets it write a
// hybrid envelope, which the reader of this version must still open: the allow-list that guards
// the reader is measured against what the published versions write
def publishedClasspathsFile = layout.buildDirectory.file('published-releases/classpaths.properties')
def resolvePublishedReleases = tasks.register('resolvePublishedReleases', GradleBuild) {
    dir = file('gradle/published-releases')
    tasks = ['writeClasspaths']
    startParameter.projectProperties = [out: publishedClasspathsFile.get().asFile.absolutePath]
    outputs.file(publishedClasspathsFile)
}

test {
    dependsOn resolvePublishedReleases
    inputs.file(publishedClasspathsFile).withPropertyName('publishedReleases')
    systemProperty 'mystic.crypt.published', publishedClasspathsFile.get().asFile.absolutePath
    // the project page's index.html, checked out from gh-pages by CI (ReleaseConsistencyTest)
    systemProperty 'mysticcrypt.pagesIndex', System.getenv('PAGES_INDEX') ?: ''
}
