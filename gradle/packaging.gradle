// Runnable uber-jar for the command-line interface: mystic-crypt-<version>-all.jar bundles every
// runtime dependency plus a Main-Class, so it runs with `java -jar mystic-crypt-<version>-all.jar
// <subcommand>`. It is an additional artifact and does NOT change the primary library jar. Run on
// the classpath, so the bundled module-info descriptors are dropped to avoid an invalid multi-module
// jar; shadow strips the dependencies' JAR signatures itself.
shadowJar {
    archiveClassifier = 'all'
    manifest {
        attributes('Main-Class': 'io.github.astrapi69.mystic.crypt.cli.MysticCryptCli')
    }
    exclude 'module-info.class'
    exclude 'META-INF/versions/*/module-info.class'
    mergeServiceFiles()
}

// The manifest names what was built and with which tools, and nothing that changes between two builds of
// the same commit: no build time, no operating system, no JDK patch level (RL-094, RL-116; the wording
// follows silly-bean#24). Which JDK builds a release is named in .sdkmanrc; the manifest keeps the feature
// release as Build-Jdk-Spec, the attribute Maven writes for the same reason.
jar {
    manifest {
        attributes(
                "Name": project.name,
                "Manifest-Version": project.version,
                "Implementation-Title": "$groupPackage" + "." + "$rootProject.name",
                "Implementation-Version": project.version,
                "Implementation-Vendor": "$projectLeaderName",
                "Created-By": "Gradle ${gradle.gradleVersion}",
                "Built-By": "$projectLeaderName",
                "Build-Jdk-Spec": projectSourceCompatibility)
    }
}

// Every archive has fixed entry times and a fixed entry order, so that it depends on the files alone.
// Gradle 9 does this by default; stated here so the build does not depend on that default (silly-bean#24).
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
