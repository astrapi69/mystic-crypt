buildscript {
    repositories {
        maven {
            url = projectRepositoriesMavenUrl
        }
    }
}

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
    alias(libs.plugins.gradle.versions.plugin)
    alias(libs.plugins.license.gradle.plugin)
    alias(libs.plugins.grgit.gradle)
    alias(libs.plugins.pitest.gradle.plugin)
    alias(libs.plugins.shadow.gradle)
    alias(libs.plugins.spotless.plugin.gradle)
    alias(libs.plugins.version.catalog.update)
}

group = "$groupPackage" as Object
version = "$projectVersion" as Object
description = "$rootProject.name"

// import gradle files
apply from: "gradle/apply-gradle-files.gradle"

java {
    sourceCompatibility = "$projectSourceCompatibility" as Object
    toolchain {
        languageVersion = JavaLanguageVersion.of("$projectSourceCompatibility")
    }
}

tasks.named("test") {
    it.mustRunAfter(tasks.named("jar"))
}

tasks.withType(JavaCompile).configureEach { javaCompiler ->
    options.encoding = "UTF-8"
    // Keep every javac lint category visible in every build (deprecation, unchecked, rawtypes,
    // this-escape, ...). Deliberately WITHOUT -Werror: a dependency or JDK update that introduces
    // a new warning must never break the build, it must only be visible.
    options.compilerArgs << "-Xlint:all"
    // javac stops reporting warnings after 100 by default, which silently truncates the list
    options.compilerArgs << "-Xmaxwarns" << "10000"
}
